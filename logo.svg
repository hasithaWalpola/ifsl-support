<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Logo Icon: Graduation Cap + Supportive Arc -->
  <g transform="translate(20, 20)">
    <!-- Shield / Support Base Arc -->
    <path d="M 20 60 C 20 100, 80 105, 80 105 C 80 105, 140 100, 140 60 C 140 30, 80 25, 80 25 C 80 25, 20 30, 20 60 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Cap Top -->
    <polygon points="80,35 125,55 80,75 35,55" fill="url(#primaryGrad)" />
    
    <!-- Cap Base -->
    <path d="M 50 63 L 50 78 C 50 85, 110 85, 110 78 L 110 63" fill="url(#primaryGrad)" opacity="0.85" />
    
    <!-- Tassel -->
    <path d="M 115 57 L 122 75 L 122 88" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <circle cx="122" cy="89" r="3" fill="#10B981" />
  </g>

  <!-- Logo Typography -->
  <!-- Main Name: IFSL -->
  <text x="175" y="72" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" font-size="44" fill="#1E3A8A" letter-spacing="1">IFSL</text>
  
  <!-- Divider Line -->
  <line x1="285" y1="38" x2="285" y2="72" stroke="#10B981" stroke-width="4" stroke-linecap="round" />

  <!-- Support Text -->
  <text x="300" y="72" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="600" font-size="44" fill="#10B981" letter-spacing="0.5">SUPPORT</text>

  <!-- Subtitle -->
  <text x="176" y="98" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="500" font-size="12" fill="#64748B" letter-spacing="1.5">INTEREST FREE STUDENT LOAN SCHEME</text>
</svg>
